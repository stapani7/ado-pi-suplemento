<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra Confirmada - HardWork</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        
        :root {
            --success-green: #4CAF50;
            --success-green-hover: #45a049;
            --background-light: #f4f4f4;
            --text-dark: #333;
            --text-medium: #555;
            --shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--background-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .success-container {
            background-color: white;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border-top: 10px solid var(--success-green); 
        } 

        .success-icon {
            font-size: 6em;
            color: var(--success-green);
            margin-bottom: 20px;
        }

        h1 {
            color: var(--text-dark);
            font-weight: 700;
            margin-bottom: 15px;
        }

        p {
            color: var(--text-medium);
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .order-details-link {
            display: inline-block;
            margin-top: 20px;
            margin-bottom: 25px;
            color: var(--success-green);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid var(--success-green);
        }

        .back-to-home-btn {
            display: inline-block;
            background-color: var(--success-green);
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-top: 15px;
        }

        .back-to-home-btn:hover {
            background-color: var(--success-green-hover);
        }
    </style>
</head>
<body>

    <div class="success-container">
        <i class="fas fa-check-circle success-icon"></i>
        
        <h1>Pedido Confirmado!</h1>
        
        <p>Sua compra foi realizada com **sucesso** e está sendo processada.</p>
        
        <p>Um e-mail de confirmação com o número do pedido (`#HW102938`) e o resumo detalhado foi enviado para o seu endereço de e-mail cadastrado.</p>
        
        <a href="#" class="order-details-link">Ver Detalhes do Pedido</a>
        
        <a href="index.html" class="back-to-home-btn">Voltar para a HardWork</a>
    </div>

</body>
</html>
